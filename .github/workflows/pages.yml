name: Fetch rain data and deploy to GitHub Pages

on:
  schedule:
    - cron: "*/15 * * * *"     # ทุก 15 นาที (GitHub อาจหน่วงได้หลายนาที)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # forecast GFS ออกวันละ 4 รอบ เก็บไฟล์ไว้ใน cache จะได้ไม่ต้องดึง NOAA ซ้ำทุก 15 นาที
      - name: Restore forecast cache
        id: fc-cache
        uses: actions/cache/restore@v4
        with:
          path: data/forecast
          key: fc-none
          restore-keys: fc-
      - name: Fetch radar + forecast
        id: fetch
        run: python fetch.py
      - name: Save forecast cache
        if: steps.fetch.outputs.fc_tag != '' && steps.fc-cache.outputs.cache-matched-key != format('fc-{0}', steps.fetch.outputs.fc_tag)
        uses: actions/cache/save@v4
        with:
          path: data/forecast
          key: fc-${{ steps.fetch.outputs.fc_tag }}
      # ลุ่มน้ำ/อ่างเก็บน้ำ (หน้าชลประทาน): ดึงทุก 6 ชม. รอบเดียวกันใช้ไฟล์ใน cache
      - name: Water slot
        id: wslot
        run: echo "slot=$(date -u +%Y%m%d)-$(( 10#$(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"
      - name: Restore water cache
        id: w-cache
        uses: actions/cache/restore@v4
        with:
          path: data/water
          key: water-${{ steps.wslot.outputs.slot }}
          restore-keys: water-
      - name: Fetch water
        if: steps.w-cache.outputs.cache-hit != 'true'
        run: python fetch_water.py --soft
      - name: Save water cache
        if: steps.w-cache.outputs.cache-hit != 'true' && hashFiles('data/water/basins.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/water
          key: water-${{ steps.wslot.outputs.slot }}
      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html app.js basemap.js basemap.json nowcast.js layers.js style.css manifest.json water.js water_basins.png water_basins.json site/
          cp -r data site/data
          # ใส่รหัส commit ท้ายชื่อไฟล์ js/css ให้ browser โหลดชุดใหม่พร้อมกันทุกครั้งที่ deploy
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
